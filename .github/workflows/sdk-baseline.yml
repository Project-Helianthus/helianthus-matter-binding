name: Matter Go adapter validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gofabric-adapter:
    name: Go adapter (go-fabric, module mode)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install pinned Ruff
        run: |
          printf '%s\n' 'ruff==0.15.10 --hash=sha256:51cb8cc943e891ba99989dd92d61e29b1d231e14811db9be6440ecf25d5c1609' > "$RUNNER_TEMP/ruff-requirements.txt"
          python3 -m pip install --no-deps --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/ruff-requirements.txt"
      - name: Validate repository lock and fail-closed mutations
        run: |
          python3 tools/validate_lock.py
          python3 -m unittest discover -s tests -v
      - name: Check Python naming, complexity and statement-count rules
        run: python3 scripts/check_python_rules.py --check
      - name: Vet and test the adopted Go adapter in module mode
        env:
          GOWORK: "off"
          GO111MODULE: "on"
        run: |
          go vet ./...
          go test -race -count=1 -timeout=5m ./...
          go vet -tags gofabric ./...
          go test -race -tags gofabric -count=1 -timeout=5m ./...
